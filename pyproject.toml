[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "laya"
version = "0.3.4"
description = "Fast, non-autoregressive System 1 decision engine with calibrated probabilities"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
# Upstream authorship is preserved: this is a fork of NandhaKishorM/laya, not a
# new work. Maintainers are who you raise an issue with about THIS fork.
authors = [
    { name = "Convai Innovations" }
]
maintainers = [
    { name = "Gelhaus Solutions" }
]
keywords = ["decision-model", "rlcd", "calibration", "system-one", "routing", "guardrails", "moderation", "triage"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.45.0",
    "safetensors>=0.4.0",
    "huggingface_hub>=0.20.0",
    "numpy>=1.20.0",
]

[project.urls]
Homepage = "https://github.com/Gelhaus-Solutions/laya"
Repository = "https://github.com/Gelhaus-Solutions/laya"
# No Issues URL: issues are disabled on this fork, so the link would 404.
Releases = "https://github.com/Gelhaus-Solutions/laya/releases"
Upstream = "https://github.com/NandhaKishorM/laya"
# The model weights stay upstream's; this fork ships code, not checkpoints.
Model = "https://huggingface.co/convaiinnovations/laya"
Demo = "https://huggingface.co/spaces/convaiinnovations/laya-demo"
