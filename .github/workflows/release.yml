name: Release

# Bump the version in pyproject.toml, tag that commit v<version> and push the tag. This
# builds, verifies the version matches the tag, and opens a GitHub Release with the
# wheel and sdist attached.
#
# This fork distributes through GitHub Releases, not PyPI -- the `laya` name on PyPI
# belongs to upstream. Nothing here needs a registry account, a Trusted Publisher or
# an API token: the release is created with the workflow's own GITHUB_TOKEN.
# Consumers install with a git ref or the attached wheel; see README "Installation".

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write        # create the GitHub Release

env:
  USE_TF: "0"
  USE_TORCH: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip build twine
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .

      - name: Tests must pass before anything is published
        run: |
          python tests/test_router.py
          python tests/test_criteria.py

      - name: Build
        run: python -m build

      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')   # workflow_dispatch has no tag to match
        run: |
          pkg=$(python -c "import re;print(re.search(r'version = \"(.*)\"', open('pyproject.toml').read()).group(1))")
          tag="${GITHUB_REF_NAME#v}"
          echo "pyproject=$pkg tag=$tag"
          test "$pkg" = "$tag" || { echo "::error::pyproject version $pkg does not match tag $tag"; exit 1; }

      - run: python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github_release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists - uploading artifacts to it"
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
